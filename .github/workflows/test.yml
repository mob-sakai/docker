name: 🧪 Test

env:
  # MINIMUM_VERSION: The minimum version to test.
  MINIMUM_VERSION: 2022.3
  # ADDITIONAL_VERSIONS: The additional versions.
  ADDITIONAL_VERSIONS: '[]'
  # EXCLUDE_FILTER: The excluded versions.
  EXCLUDE_FILTER: '(2022.1|2022.2|2023.1|2023.2|2023.3)'

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'The versions to test. If empty, the latest patch for each minor version is automatically fetched. (e.g. ["2021.3.0f1", "2022.3.0f1", "6000.0.2f1"])'
        required: false
        default: ''
      modules:
        description: 'The modules to test. If empty, all modules are tested. (e.g. ["base", "linux-il2cpp", "linux-server", "windows-mono", "windows-coreclr", "windows-server", "mac-mono", "mac-coreclr", "mac-server", "ios", "android", "webgl"])'
        required: false
        default: '["base", "linux-il2cpp", "linux-server", "windows-mono", "windows-coreclr", "windows-server", "mac-mono", "mac-coreclr", "mac-server", "ios", "android", "webgl"]'
      runs-on:
        description: 'The runs-on to use for the job. (e.g. ubuntu-latest, self-hosted)'
        required: true
        default: 'ubuntu-latest'
  push:
    branches:
      - develop
    paths:
      - "**/Dockerfile"
      - ".github/workflows/test.yml"
      - "reference-project/**"
  pull_request:
    paths:
      - "**/Dockerfile"
      - ".github/workflows/test.yml"
      - "reference-project/**"
  schedule:
    - cron: "0 0 * * 0" # weekly

jobs:
  ###########################
  #        Build base       #
  ###########################
  base:
    name: 🛠️ Build base image
    runs-on: ${{ github.event.inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.setup.outputs.matrix }}
    steps:
      ###########################
      #          Setup          #
      ###########################
      - name: 🚚 Checkout
        uses: actions/checkout@v7
      - name: ⚙️ Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: ⚙️ Setup Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      ###########################
      #       Build base        #
      ###########################
      - name: 🛠️ Build image (unity3d_base:local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: base/Dockerfile
          tags: unity3d_base:local
          push: false
      ###########################
      #   Save images for next  #
      ###########################
      - name: 💾 Save images for next
        run: |
          docker images
          docker save -o base.tar unity3d_base:local
      - name: 📦 Upload base image for next
        uses: actions/upload-artifact@v7
        with:
          name: base
          path: base.tar
          retention-days: 1

      ###########################
      #    Setup build matrix   #
      ###########################
      - name: ⚙️ Setup build matrix
        id: setup
        run: |
          echo "MINIMUM_VERSION=${MINIMUM_VERSION}" | tee -a $GITHUB_STEP_SUMMARY
          echo "ADDITIONAL_VERSIONS=${ADDITIONAL_VERSIONS}" | tee -a $GITHUB_STEP_SUMMARY
          echo "INPUT_VERSIONS="'${{ inputs.versions }}' | tee -a $GITHUB_STEP_SUMMARY

          INPUT_VERSIONS='${{ inputs.versions }}'
          MODULES='${{ inputs.modules }}'
          if [ -z "${MODULES}" ]; then
            MODULES='["base", "linux-il2cpp", "linux-server", "windows-mono", "windows-coreclr", "windows-server", "mac-mono", "mac-coreclr", "mac-server", "ios", "android", "webgl"]'
          fi

          echo "INPUT_VERSIONS=${INPUT_VERSIONS}" | tee -a $GITHUB_STEP_SUMMARY
          echo "MODULES=${MODULES}" | tee -a $GITHUB_STEP_SUMMARY

          # Build the matrix from each module's supported Unity version range.
          MATRIX='[]'
          for module in $(echo "${MODULES}" | jq -r '.[]'); do
            MODULE_MIN_VERSION="${MINIMUM_VERSION}"
            MODULE_MAX_VERSION=""
            if [ -n "${INPUT_VERSIONS}" ]; then
              MODULE_MIN_VERSION=""
            fi
            case "${module}" in
              *-server) MODULE_MIN_VERSION="2021.3" ;;
              *-mono) MODULE_MAX_VERSION="6000.99" ;;
              *-coreclr) MODULE_MIN_VERSION="7000.0" ;;
            esac

            VERSION_ARGS=(--min "${MODULE_MIN_VERSION}")
            if [ -n "${MODULE_MAX_VERSION}" ]; then
              VERSION_ARGS+=(--max "${MODULE_MAX_VERSION}")
            fi

            if [ -n "${INPUT_VERSIONS}" ]; then
              MODULE_CANDIDATES="${INPUT_VERSIONS}"
            else
              LATEST_VERSIONS=$(npx --yes unity-changeset@latest list --versions --latest-patch "${VERSION_ARGS[@]}" --json --all)
              MODULE_CANDIDATES=$(echo "[${LATEST_VERSIONS}, ${ADDITIONAL_VERSIONS}]" \
                | jq -c '[ flatten | sort | unique | .[] | select( test("${{ env.EXCLUDE_FILTER }}") | not ) ]')
            fi

            MODULE_VERSIONS=$(echo "${MODULE_CANDIDATES}" | jq -c \
              --arg min "${MODULE_MIN_VERSION}" \
              --arg max "${MODULE_MAX_VERSION}" '
                def version_pair:
                  capture("^(?<major>[0-9]+)\\.(?<minor>[0-9]+)")
                  | [(.major | tonumber), (.minor | tonumber)];
                def at_least($left; $right):
                  ($left[0] > $right[0]) or ($left[0] == $right[0] and $left[1] >= $right[1]);
                def at_most($left; $right):
                  ($left[0] < $right[0]) or ($left[0] == $right[0] and $left[1] <= $right[1]);
                [
                  .[] as $version
                  | ($version | version_pair) as $pair
                  | select(if $min == "" then true else at_least($pair; ($min | version_pair)) end)
                  | select(if $max == "" then true else at_most($pair; ($max | version_pair)) end)
                  | $version
                ]')
            MODULE_MATRIX=$(echo "${MODULE_VERSIONS}" | jq -c --arg module "${module}" '[.[] | {version: ., module: $module}]')
            MATRIX=$(jq -cn --argjson matrix "${MATRIX}" --argjson module_matrix "${MODULE_MATRIX}" '$matrix + $module_matrix')

            echo "${module} (min=${MODULE_MIN_VERSION}, max=${MODULE_MAX_VERSION:-none}): ${MODULE_VERSIONS}" | tee -a $GITHUB_STEP_SUMMARY
          done

          if [ "${MATRIX}" = "[]" ]; then
            echo "::error::No compatible Unity version and module combinations were found for the specified inputs."
            exit 1
          fi

          echo "matrix=${MATRIX}" | tee -a $GITHUB_OUTPUT
          echo "Compatible combinations: $(echo "${MATRIX}" | jq length)" | tee -a $GITHUB_STEP_SUMMARY

  ###########################
  #  Build editor and test  #
  ###########################
  editor:
    needs: base
    name: 🧪 Test editor (${{ matrix.version }}-${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.base.outputs.matrix) }}

    steps:
      ###########################
      #          Setup          #
      ###########################
      - name: 🚚 Checkout
        uses: actions/checkout@v7
      - name: ⚙️ Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: ⚙️ Setup Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: 🧹 Free disk space (Phase 1)
        uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 🧹 Free disk space (Phase 2)
        run: .github/workflows/scripts/free_disk_space.sh

      ###########################
      #       Restore base      #
      ###########################
      - name: 📥 Download artifact
        uses: actions/download-artifact@v8
        with:
          name: base

      - name: 📥 Restore base
        run: |
          docker load -i base.tar

      ###########################
      #      Setup to build     #
      ###########################
      - name: 🔍 Find changeSet for ${{ matrix.version }}
        id: changeSet
        run: echo "value=`npx --yes unity-changeset@latest ${{ matrix.version }}`" | tee $GITHUB_OUTPUT

      - name: 🔍 Find target platform for ${{ matrix.module }}
        id: targetPlatform
        run: |
          case ${{ matrix.module }} in
            base|linux-il2cpp|linux-server ) echo "value=StandaloneLinux64" | tee $GITHUB_OUTPUT;;
            windows-mono|windows-coreclr|windows-server ) echo "value=StandaloneWindows" | tee $GITHUB_OUTPUT;;
            mac-mono|mac-coreclr|mac-server ) echo "value=StandaloneOSX" | tee $GITHUB_OUTPUT;;
            ios )               echo "value=iOS" | tee $GITHUB_OUTPUT;;
            android )           echo "value=Android" | tee $GITHUB_OUTPUT;;
            webgl )             echo "value=WebGL" | tee $GITHUB_OUTPUT;;
            * )                 echo "value=StandaloneLinux64" | tee $GITHUB_OUTPUT;;
          esac

      ###########################
      #       Build editor      #
      ###########################
      - name: 🛠️ Build image (unity3d:local)
        # if: steps.build-1.outcome == 'failure'
        uses: docker/build-push-action@v7
        id: build-1
        continue-on-error: true
        timeout-minutes: 40
        with:
          context: .
          file: editor/Dockerfile
          build-args: |
            baseImage=unity3d_base:local
            version=${{ matrix.version }}
            changeSet=${{ steps.changeSet.outputs.value }}
            module=${{ matrix.module }}
          tags: unity3d:local
          push: false

      ###########################
      #   Build editor (retry)  #
      ###########################
      - name: 💤 Sleep for retry
        if: steps.build-1.outcome == 'failure'
        run: sleep 120

      - name: 🛠️ Build Image (unity3d:local, retry)
        if: steps.build-1.outcome == 'failure'
        uses: docker/build-push-action@v7
        id: build-2
        # continue-on-error: true
        timeout-minutes: 40
        with:
          context: .
          file: editor/Dockerfile
          build-args: |
            baseImage=unity3d_base:local
            version=${{ matrix.version }}
            changeSet=${{ steps.changeSet.outputs.value }}
            module=${{ matrix.module }}
          tags: unity3d:local
          push: false

      - name: 📥 Cache library
        uses: actions/cache@v6
        with:
          path: reference-project/Library
          key: Library-${{ matrix.version }}-${{ matrix.module }}-${{ github.sha }}
          restore-keys: |
            Library-${{ matrix.version }}-${{ matrix.module }}-
            Library-${{ matrix.version }}-
            Library-

      ###########################
      #           Test          #
      ###########################
      - name: 🧪 Run tests
        uses: game-ci/unity-test-runner@v4
        timeout-minutes: 45
        with:
          unityVersion: ${{ matrix.version }}
          customImage: unity3d:local
          projectPath: reference-project
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customParameters: -nographics -buildTarget ${{ steps.targetPlatform.outputs.value }}

      ###########################
      # Validate Android Utils  #
      ###########################
      - name: 🔍 Validate Android Utils
        if: matrix.module == 'android'
        run: |
          docker run unity3d:local /bin/bash -c -l 'java -version && sdkmanager --version && sdkmanager --list'

      ###########################
      #          Build          #
      ###########################
      - name: ⚙️ Setup (IL2CPP)
        if: matrix.module == 'linux-il2cpp'
        run: |
          sed -i -e 's/Standalone: 0$/Standalone: 1/' reference-project/ProjectSettings/ProjectSettings.asset

      - name: 🛠️ Build Unity Project ${{ matrix.module }}
        uses: game-ci/unity-builder@v6
        timeout-minutes: 45
        with:
          unityVersion: ${{ matrix.version }}
          customImage: unity3d:local
          projectPath: reference-project
          targetPlatform: ${{ steps.targetPlatform.outputs.value }}
          allowDirtyBuild: true
          customParameters: -nographics

      ###########################
      #       Build (GZip)      #
      ###########################
      - name: ⚙️ Setup (WebGL, GZip)
        if: matrix.module == 'webgl'
        run: |
          sed -i -e 's/webGLCompressionFormat: .*$/webGLCompressionFormat: 1/' reference-project/ProjectSettings/ProjectSettings.asset

      - name: 🛠️ Build Unity Project (WebGL, GZip)
        if: matrix.module == 'webgl'
        uses: game-ci/unity-builder@v6
        timeout-minutes: 45
        with:
          unityVersion: ${{ matrix.version }}
          customImage: unity3d:local
          projectPath: reference-project
          targetPlatform: ${{ steps.targetPlatform.outputs.value }}
          allowDirtyBuild: true
          customParameters: -nographics

      ###########################
      #       Build (Brotli)      #
      ###########################
      - name: ⚙️ Setup (WebGL, Brotli)
        if: matrix.module == 'webgl'
        run: |
          sed -i -e 's/webGLCompressionFormat: .*$/webGLCompressionFormat: 0/' reference-project/ProjectSettings/ProjectSettings.asset

      - name: 🛠️ Build Unity Project (WebGL, Brotli)
        if: matrix.module == 'webgl'
        uses: game-ci/unity-builder@v6
        timeout-minutes: 45
        with:
          unityVersion: ${{ matrix.version }}
          customImage: unity3d:local
          projectPath: reference-project
          targetPlatform: ${{ steps.targetPlatform.outputs.value }}
          allowDirtyBuild: true
          customParameters: -nographics
